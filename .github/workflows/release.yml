name: Release

on:
  push:
    tags: ["v*"]
  # Useful for rehearsing the packaging without cutting a tag; the upload step
  # is skipped when there is no tag to attach assets to.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: tar.gz }
          # The point of the whole workflow: a Windows user should never need
          # a compiler, NASM, CMake or the Visual Studio build tools.
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: zip }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The archive name is a contract with install.ps1, which looks for an
      # asset ending in "<target>.zip". Keep the two in step.
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          name="psxtui-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/psxtui "dist/$name/"
          cp README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "psxtui-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/psxtui.exe" "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

          # Also ship the bare .exe. The zip is what install.ps1 fetches, but a
          # person browsing the releases page wants one file to click, not an
          # archive holding a copy of the README they are already reading.
          Copy-Item "dist/$name/psxtui.exe" "dist/$name.exe"

          foreach ($f in "dist/$name.zip", "dist/$name.exe") {
            # Lowercase, two spaces, filename: the format `sha256sum -c` reads.
            # Get-FileHash's bare uppercase hash is checkable by nothing.
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)" |
              Out-File "$f.sha256" -Encoding ascii -NoNewline
          }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Prebuilt binaries — no Rust toolchain needed.

            **Windows:** download the `x86_64-pc-windows-msvc.exe`, rename it to
            `psxtui.exe` and run it from Windows Terminal — or run `./install.ps1`
            from a clone to have it placed on your PATH. The `.zip` holds the same
            binary plus the README, and is what the installer fetches.
            **Linux / macOS:** download the matching `.tar.gz`, or run `./install.sh`.
